<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apartment Project Details | Adhao Realty</title>
  <meta name="description" content="Explore complete apartment building and residential project sale opportunities, project details, amenities, location and enquiries with Adhao Realty in Mumbai and Pune.">
  <meta name="theme-color" content="#101b32">

  <link rel="icon" type="image/webp" href="assets/logoweb.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101b32;
      --navy-light: #1b2940;
      --gold: #c8a45d;
      --gold-light: #f6c453;
      --white: #ffffff;
      --page: #f6f7fa;
      --text: #253147;
      --muted: #6b7485;
      --border: #e4e7ed;
      --success: #15803d;
      --danger: #b42318;
      --radius: 12px;
      --shadow: 0 8px 28px rgba(16, 27, 50, .07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--page);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body.viewer-open {
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1400px, 92%);
      margin-inline: auto;
    }

    .hidden {
      display: none !important;
    }

    /* HEADER */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, .98);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 3px 18px rgba(16, 27, 50, .04);
    }

    .navbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .logo img {
      width: 145px;
      height: 62px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-left: auto;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 700;
      transition: color .2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #a77f32;
    }

    .nav-cta {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 6px;
      background: var(--navy);
      color: white;
      font-size: 13px;
      font-weight: 800;
      transition: .2s ease;
    }

    .nav-cta:hover {
      background: var(--gold);
      color: var(--navy);
    }

    .menu-toggle {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      color: var(--navy);
      font-size: 23px;
    }

    /* PAGE INTRO */

    .page-intro {
      padding: 25px 0 8px;
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .breadcrumbs a:hover {
      color: #9b7837;
    }

    .breadcrumbs span:last-child {
      color: var(--navy);
      font-weight: 700;
    }

    /* STATUS MESSAGES */

    .status-panel {
      width: min(900px, 92%);
      margin: 45px auto;
      padding: 45px 25px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .status-panel h2 {
      margin-bottom: 12px;
      color: var(--navy);
      font-size: 25px;
    }

    .status-panel p {
      margin-bottom: 20px;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 4px solid #e9edf3;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* PROPERTY HEADER */

    .property-page {
      padding: 22px 0 80px;
    }

    .property-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 25px;
    }

    .property-heading-main {
      min-width: 0;
    }

    .property-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 11px;
      border-radius: 5px;
      background: #f4ead5;
      color: #795a22;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .badge.dark {
      background: var(--navy);
      color: white;
    }

    .property-heading h1 {
      margin-bottom: 7px;
      color: var(--navy);
      font-size: clamp(28px, 4vw, 43px);
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
    }

    .property-location {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .property-location .pin {
      color: #9b7837;
    }

    .heading-price {
      flex-shrink: 0;
      padding-top: 14px;
      text-align: right;
    }

    .heading-price small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .heading-price strong {
      color: var(--navy);
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.3;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(180px, 230px));
      gap: 12px;
      margin-bottom: 25px;
      overflow: hidden;
      border-radius: var(--radius);
    }

    .gallery-main,
    .gallery-side,
    .gallery-placeholder {
      position: relative;
      overflow: hidden;
      border: 0;
      padding: 0;
      background: #e7eaf0;
    }

    .gallery-main {
      grid-row: 1 / 3;
      min-height: 380px;
    }

    .gallery-side {
      min-height: 180px;
    }

    .gallery-main img,
    .gallery-side img,
    .gallery-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .gallery-main:hover img,
    .gallery-side:hover img {
      transform: scale(1.035);
    }

    .gallery-main:focus-visible,
    .gallery-side:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: -3px;
    }

    .gallery-count {
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      background: rgba(12, 20, 35, .8);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .gallery-placeholder {
      display: grid;
      place-items: center;
      min-height: 150px;
      color: #788399;
      text-align: center;
    }

    .gallery-placeholder span {
      padding: 15px;
    }

    /* IMAGE VIEWER */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 35px;
      background: rgba(5, 10, 20, .94);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-image-wrap {
      width: min(1200px, 100%);
      height: min(82vh, 850px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
      color: white;
      font-size: 25px;
    }

    .lightbox-close {
      top: 20px;
      right: 20px;
    }

    .lightbox-prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 17px;
      color: white;
      font-size: 13px;
    }

    /* QUICK FACTS */

    .quick-facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .fact-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 17px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .fact-icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #f6efdf;
      color: #94702e;
      font-size: 21px;
    }

    .fact-card small {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .fact-card strong {
      display: block;
      color: var(--navy);
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

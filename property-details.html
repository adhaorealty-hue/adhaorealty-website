<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apartment Project Details | Adhao Realty</title>
  <meta name="description" content="Explore complete apartment building and residential project sale opportunities, project details, amenities, location and enquiries with Adhao Realty in Mumbai and Pune.">
  <meta name="theme-color" content="#101b32">

  <link rel="icon" type="image/webp" href="assets/logoweb.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101b32;
      --navy-light: #1b2940;
      --gold: #c8a45d;
      --gold-light: #f6c453;
      --white: #ffffff;
      --page: #f6f7fa;
      --text: #253147;
      --muted: #6b7485;
      --border: #e4e7ed;
      --success: #15803d;
      --danger: #b42318;
      --radius: 12px;
      --shadow: 0 8px 28px rgba(16, 27, 50, .07);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--page);
      color: var(--text);
      line-height: 1.7;
      overflow-x: hidden;
    }

    body.viewer-open {
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1400px, 92%);
      margin-inline: auto;
    }

    .hidden {
      display: none !important;
    }

    /* HEADER */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, .98);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 3px 18px rgba(16, 27, 50, .04);
    }

    .navbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .logo {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }

    .logo img {
      width: 145px;
      height: 62px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-left: auto;
    }

    .nav-links a {
      font-size: 13px;
      font-weight: 700;
      transition: color .2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #a77f32;
    }

    .nav-cta {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 6px;
      background: var(--navy);
      color: white;
      font-size: 13px;
      font-weight: 800;
      transition: .2s ease;
    }

    .nav-cta:hover {
      background: var(--gold);
      color: var(--navy);
    }

    .menu-toggle {
      display: none;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: white;
      color: var(--navy);
      font-size: 23px;
    }

    /* PAGE INTRO */

    .page-intro {
      padding: 25px 0 8px;
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .breadcrumbs a:hover {
      color: #9b7837;
    }

    .breadcrumbs span:last-child {
      color: var(--navy);
      font-weight: 700;
    }

    /* STATUS MESSAGES */

    .status-panel {
      width: min(900px, 92%);
      margin: 45px auto;
      padding: 45px 25px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .status-panel h2 {
      margin-bottom: 12px;
      color: var(--navy);
      font-size: 25px;
    }

    .status-panel p {
      margin-bottom: 20px;
      color: var(--muted);
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 4px solid #e9edf3;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* PROPERTY HEADER */

    .property-page {
      padding: 22px 0 80px;
    }

    .property-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 25px;
      margin-bottom: 25px;
    }

    .property-heading-main {
      min-width: 0;
    }

    .property-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 11px;
      border-radius: 5px;
      background: #f4ead5;
      color: #795a22;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .badge.dark {
      background: var(--navy);
      color: white;
    }

    .property-heading h1 {
      margin-bottom: 7px;
      color: var(--navy);
      font-size: clamp(28px, 4vw, 43px);
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
    }

    .property-location {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .property-location .pin {
      color: #9b7837;
    }

    .heading-price {
      flex-shrink: 0;
      padding-top: 14px;
      text-align: right;
    }

    .heading-price small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .heading-price strong {
      color: var(--navy);
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.3;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(180px, 230px));
      gap: 12px;
      margin-bottom: 25px;
      overflow: hidden;
      border-radius: var(--radius);
    }

    .gallery-main,
    .gallery-side,
    .gallery-placeholder {
      position: relative;
      overflow: hidden;
      border: 0;
      padding: 0;
      background: #e7eaf0;
    }

    .gallery-main {
      grid-row: 1 / 3;
      min-height: 380px;
    }

    .gallery-side {
      min-height: 180px;
    }

    .gallery-main img,
    .gallery-side img,
    .gallery-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .gallery-main:hover img,
    .gallery-side:hover img {
      transform: scale(1.035);
    }

    .gallery-main:focus-visible,
    .gallery-side:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: -3px;
    }

    .gallery-count {
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      background: rgba(12, 20, 35, .8);
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .gallery-placeholder {
      display: grid;
      place-items: center;
      min-height: 150px;
      color: #788399;
      text-align: center;
    }

    .gallery-placeholder span {
      padding: 15px;
    }

    /* IMAGE VIEWER */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 35px;
      background: rgba(5, 10, 20, .94);
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-image-wrap {
      width: min(1200px, 100%);
      height: min(82vh, 850px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      background: rgba(255, 255, 255, .1);
      color: white;
      font-size: 25px;
    }

    .lightbox-close {
      top: 20px;
      right: 20px;
    }

    .lightbox-prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 17px;
      color: white;
      font-size: 13px;
    }

    /* QUICK FACTS */

    .quick-facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .fact-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 17px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .fact-icon {
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #f6efdf;
      color: #94702e;
      font-size: 21px;
    }

    .fact-card small {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .fact-card strong {
      display: block;
      color: var(--navy);
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

        /* MAIN LAYOUT */

    .property-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      align-items: start;
      gap: 25px;
    }

    .main-column,
    .side-column {
      min-width: 0;
    }

    .content-card {
      margin-bottom: 22px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: 0 3px 15px rgba(16, 27, 50, .025);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--navy);
      font-size: 22px;
      line-height: 1.35;
    }

    .section-title::before {
      content: "";
      width: 4px;
      height: 27px;
      flex-shrink: 0;
      border-radius: 3px;
      background: var(--gold);
    }

    .description {
      color: #596477;
      font-size: 14px;
      line-height: 2;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .property-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .meta-item {
      padding: 14px;
      border: 1px solid #edf0f4;
      border-radius: 8px;
      background: #fbfcfd;
    }

    .meta-item small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .meta-item strong {
      color: var(--navy);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    /* AMENITIES */

    .amenities-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .amenity {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 10px;
      border: 1px solid #edf0f4;
      border-radius: 7px;
      background: #fbfcfd;
      color: #465269;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .amenity span:first-child {
      color: #9b7837;
      font-size: 16px;
    }

    .empty-note {
      color: var(--muted);
      font-size: 13px;
    }

    /* MAP */

    .map-frame {
      width: 100%;
      height: 330px;
      border: 0;
      border-radius: 8px;
      background: #edf0f4;
    }

    .map-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ABOUT PROPERTY - FULL WIDTH */

    .about-property-section {
      width: 100%;
      margin-top: 25px;
      padding: 35px;
      border: 1px solid #e7dfcd;
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
    }

    .about-property-section .section-title {
      font-size: 25px;
      margin-bottom: 22px;
    }

    .about-property-section .description {
      max-width: 100%;
      font-size: 15px;
      line-height: 2;
    }

    .about-property-bottom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 28px;
      padding-top: 23px;
      border-top: 1px solid var(--border);
    }

    .about-property-point {
      padding: 17px;
      border-radius: 8px;
      background: #f8f5ee;
    }

    .about-property-point strong {
      display: block;
      margin-bottom: 5px;
      color: var(--navy);
      font-size: 13px;
    }

    .about-property-point span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    /* ENQUIRY CARD */

    .enquiry-card {
      position: sticky;
      top: 100px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
    }

    .enquiry-card h2 {
      margin-bottom: 5px;
      color: var(--navy);
      font-size: 23px;
      line-height: 1.4;
    }

    .enquiry-card .subheading {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
    }

    .enquiry-price {
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 8px;
      background: #f8f4eb;
    }

    .enquiry-price small {
      display: block;
      color: #796a4e;
      font-size: 11px;
    }

    .enquiry-price strong {
      display: block;
      color: var(--navy);
      font-size: 27px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #344056;
      font-size: 12px;
      font-weight: 700;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      min-height: 45px;
      padding: 11px 12px;
      border: 1px solid #dce1e9;
      border-radius: 6px;
      outline: none;
      background: white;
      color: var(--text);
      font-size: 13px;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(200, 164, 93, .14);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      padding: 12px 17px;
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      transition: .2s ease;
    }

    .btn-gold {
      background: var(--gold);
      color: var(--navy);
    }

    .btn-gold:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .btn-dark {
      margin-top: 10px;
      background: var(--navy);
      color: white;
    }

    .btn-dark:hover {
      background: var(--navy-light);
    }

    .btn-whatsapp {
      margin-top: 10px;
      background: #178b4d;
      color: white;
    }

    .btn-whatsapp:hover {
      background: #116f3c;
    }

    .btn-outline {
      margin-top: 10px;
      border-color: var(--border);
      background: white;
      color: var(--navy);
    }

    .btn-outline:hover {
      border-color: var(--gold);
      background: #fbf8f1;
    }

    .enquiry-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
      text-align: center;
    }

    .enquiry-status {
      margin-top: 12px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .enquiry-status.error {
      color: var(--danger);
    }

    .enquiry-status.success {
      color: var(--success);
    }

    .direct-contact {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .direct-contact a {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #4d596e;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .direct-contact a:hover {
      color: #9b7837;
    }

    /* TRUST NOTE */

    .trust-note {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 15px;
      padding: 17px;
      border: 1px solid #eee4d0;
      border-radius: 9px;
      background: #faf6ed;
    }

    .trust-note .trust-icon {
      color: #96712e;
      font-size: 22px;
    }

    .trust-note strong {
      display: block;
      margin-bottom: 3px;
      color: var(--navy);
      font-size: 12px;
    }

    .trust-note p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    /* FOOTER */

    .site-footer {
      padding: 48px 0 20px;
      background: #0b1427;
      color: white;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 35px;
      margin-bottom: 35px;
    }

    .footer-logo {
      width: 145px;
      height: 62px;
      object-fit: contain;
      padding: 5px;
      margin-bottom: 15px;
      border-radius: 5px;
      background: white;
    }

    .footer-about {
      max-width: 400px;
      color: #b8c1d1;
      font-size: 12px;
      line-height: 1.9;
    }

    .site-footer h3 {
      margin-bottom: 14px;
      color: var(--gold-light);
      font-size: 14px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
    }

    .footer-links a {
      color: #b8c1d1;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .footer-links a:hover {
      color: var(--gold-light);
    }

    .copyright {
      padding-top: 19px;
      border-top: 1px solid rgba(255, 255, 255, .12);
      color: #98a4b8;
      font-size: 11px;
      text-align: center;
    }

    /* RESPONSIVE */

    @media (max-width: 1050px) {
      .nav-links {
        gap: 15px;
      }

      .nav-links a {
        font-size: 12px;
      }

      .property-layout {
        grid-template-columns: minmax(0, 1fr) 315px;
        gap: 18px;
      }

      .quick-facts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .navbar {
        min-height: 70px;
      }

      .menu-toggle {
        display: grid;
        place-items: center;
        margin-left: auto;
      }

      .nav-links {
        position: absolute;
        top: 70px;
        left: 0;
        right: 0;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 10px 4%;
        border-top: 1px solid var(--border);
        background: white;
        box-shadow: 0 10px 20px rgba(16, 27, 50, .08);
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        padding: 12px 0;
        border-bottom: 1px solid #f0f1f4;
        font-size: 13px;
      }

      .nav-cta {
        display: none;
      }

      .property-layout {
        grid-template-columns: 1fr;
      }

      .side-column {
        order: -1;
      }

      .enquiry-card {
        position: static;
      }

      .gallery {
        grid-template-rows: repeat(2, minmax(140px, 190px));
      }

      .gallery-main {
        min-height: 320px;
      }
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
      }

      .logo img {
        width: 125px;
      }

      .property-page {
        padding-top: 15px;
      }

      .property-heading {
        flex-direction: column;
        gap: 8px;
      }

      .heading-price {
        padding-top: 0;
        text-align: left;
      }

      .gallery {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 230px 115px;
        gap: 7px;
      }

      .gallery-main {
        grid-column: 1 / 3;
        grid-row: 1;
        min-height: 230px;
      }

      .gallery-side {
        min-height: 115px;
      }

      .quick-facts {
        gap: 8px;
      }

      .fact-card {
        padding: 12px 9px;
        gap: 8px;
      }

      .fact-icon {
        width: 35px;
        height: 35px;
        font-size: 17px;
